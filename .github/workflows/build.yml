name: Build MedGen AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Build APK
        continue-on-error: true
        run: |
          buildozer -v android debug > build.log 2>&1 || true
          echo "===== LAST 300 LINES ====="
          tail -300 build.log

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MedGenAI-full-log
          path: build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MedGenAI-APK
          path: bin/*.apk
          if-no-files-found: ignore
