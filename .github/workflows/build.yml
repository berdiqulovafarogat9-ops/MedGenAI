name: Build MedGen AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. GitHub repository'ni yuklash
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      # 4. Android / Buildozer uchun system dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            gettext \
            autopoint \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            liblzma-dev

      # 5. Buildozer
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install buildozer "cython==3.0.12"

      # 6. Tekshirish
      - name: Check Build Configuration
        run: |
          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "Project files:"
          ls -la

          echo "Buildozer spec:"
          test -f buildozer.spec

          echo "Main Python:"
          test -f main.py

          echo "Icon:"
          test -f medgen_ai_icon.png

      # 7. APK build
      - name: Build APK
        run: |
          buildozer -v android debug

      # 8. APK mavjudligini tekshirish
      - name: Check APK
        if: success()
        run: |
          echo "APK files:"
          ls -lah bin/

          test -n "$(find bin -name '*.apk' -type f)"

      # 9. APK'ni artifact sifatida saqlash
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MedGenAI-APK
          path: bin/*.apk
          if-no-files-found: error
