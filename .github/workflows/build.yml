name: Build MedGen AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. Repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      # 4. System dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            gettext \
            autopoint \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            liblzma-dev

      # 5. Python build tools
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34"
          python -m pip install buildozer

      # 6. Check environment
      - name: Check Build Configuration
        run: |
          echo "=============================="
          echo "Python"
          python --version

          echo "=============================="
          echo "Java"
          java -version

          echo "=============================="
          echo "Cython"
          cython --version

          echo "=============================="
          echo "Buildozer"
          buildozer --version

          echo "=============================="
          echo "Project files"
          ls -la

          echo "=============================="
          echo "Required files"

          test -f buildozer.spec
          test -f main.py
          test -f medgen_ai_icon.png

          echo "CONFIGURATION CHECK: PASS"

      # 7. Clean previous build/cache
      - name: Clean Buildozer Cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

          echo "BUILD CACHE CLEANED"

      # 8. Build APK
      - name: Build APK
        run: |
          buildozer -v android debug

      # 9. Check APK
      - name: Check APK
        if: success()
        run: |
          echo "=============================="
          echo "APK FILES"
          echo "=============================="

          ls -lah bin/

          test -n "$(find bin -name '*.apk' -type f)"

          echo "APK BUILD: PASS"

      # 10. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MedGenAI-APK
          path: bin/*.apk
          if-no-files-found: error
