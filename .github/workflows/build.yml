name: Build MedGen AI APK

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Python 3.11
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------
      # 3. Java 17
      # --------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"


      # --------------------------------------------------
      # 4. Android / Build dependencies
      # --------------------------------------------------

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev


      # --------------------------------------------------
      # 5. Python build tools
      # --------------------------------------------------

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
          python --version
          pip --version


      # --------------------------------------------------
      # 6. Install Buildozer
      # --------------------------------------------------

      - name: Install Buildozer
        run: |
          python -m pip install buildozer
          buildozer --version


      # --------------------------------------------------
      # 7. Show build configuration
      # --------------------------------------------------

      - name: Show build configuration
        run: |
          echo "========== PYTHON =========="
          python --version

          echo "========== JAVA =========="
          java -version

          echo "========== BUILDOZER =========="
          buildozer --version

          echo "========== BUILDOZER SPEC =========="
          cat buildozer.spec


      # --------------------------------------------------
      # 8. Clean previous build
      # --------------------------------------------------

      - name: Clean Buildozer
        run: |
          buildozer android clean || true
          rm -rf .buildozer
          rm -rf bin


      # --------------------------------------------------
      # 9. Build APK
      # --------------------------------------------------

      - name: Build APK
        run: |
          buildozer -v android debug


      # --------------------------------------------------
      # 10. Check APK
      # --------------------------------------------------

      - name: Check APK
        run: |
          echo "========== APK FILES =========="
          ls -lah bin/

          echo "========== APK CHECK =========="
          test -n "$(find bin -name '*.apk' -print -quit)"

          echo "APK BUILD SUCCESS"


      # --------------------------------------------------
      # 11. Upload APK
      # --------------------------------------------------

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4

        with:
          name: MedGenAI-Diagnostic-APK
          path: bin/*.apk
